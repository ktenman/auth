name: Build & Test

on:
  workflow_dispatch:
  push:
  pull_request:

# one run per ref at a time, so latest-amd64 and latest-arm64 always come from the same commit;
# elsewhere a new push cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_IMAGE: ktenman/auth
  DOCKER_IMAGE_TAG: ${{ github.sha }}

jobs:

  image:
    name: 🔨 Build ${{ matrix.arch }} image
    needs: [ test ]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build native image
        run: docker build -t authbench-app .
      - name: Sign in, validate and log out against the image
        run: IMAGE=authbench-app bench/run.sh
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Push ${{ matrix.arch }} image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag authbench-app "$DOCKER_IMAGE:latest-${{ matrix.arch }}"
          docker push "$DOCKER_IMAGE:latest-${{ matrix.arch }}"

  build_and_push:
    name: 🔨 Push multi-arch image
    needs: [ image ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Combine both arch images as latest
        run: docker buildx imagetools create -t "$DOCKER_IMAGE:latest" "$DOCKER_IMAGE:latest-amd64" "$DOCKER_IMAGE:latest-arm64"

  test:
    name: 🧪 Test with Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Run Gradle test
        run: ./gradlew test --info -x bootJar
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ${{ format('Test reports and screenshots ({0})', matrix.test-type) }}
          path: build/reports/tests

  auto-merge-dependabot:
    name: 🤖 Auto merge dependabot PR
    needs: [ test, image ]
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 🤖Merge PR from dependabot
        uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: minor
          merge-method: rebase
