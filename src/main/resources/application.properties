redirect.url=${REDIRECT_URI:YOUR_REDIRECT_URI}
allowed.emails=${ALLOWED_EMAILS:YOUR_ALLOWED_EMAILS}

server.port=8083
server.servlet.session.timeout=30d
server.servlet.session.cookie.name=AUTHSESSION
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=native

spring.web.error.whitelabel.enabled=false
spring.servlet.encoding.force=true
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.application.name=auth
spring.data.redis.host=redis
# not the default spring:session: sessions the JVM build wrote can hold types the native image can't read
spring.session.data.redis.namespace=auth
