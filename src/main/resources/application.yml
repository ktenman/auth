management:
  endpoints:
    web:
      exposure:
        include: health,info

redirect:
  url: ${REDIRECT_URI:YOUR_REDIRECT_URI}

allowed:
  emails: ${ALLOWED_EMAILS:YOUR_ALLOWED_EMAILS}

server:
  port: 8083
  servlet:
    session:
      timeout: 43200m # 30 days in minutes
      cookie:
        max-age: 2592000 # 30 days in seconds
        http-only: true
        secure: true
  forward-headers-strategy: native

spring:
  web:
    error:
      whitelabel:
        enabled: false
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
  application:
    name: auth
  thymeleaf:
    cache: false
  data:
    redis:
      host: redis
      port: 6379
  session:
    store-type: redis
    data:
      redis:
        namespace: spring:session  # Optional: defines a namespace for session keys
    cookie:
      max-age: 2592000 # 30 days in seconds
      http-only: true
      secure: true

logging:
  level:
    org.springframework.boot.actuate: WARN
    org.springframework.security: INFO
    org.springframework.web: INFO
    ee.tenman.auth: INFO

